name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Fails if type generation had to rewrite tsconfig.json, which would hide a broken committed config.
      - run: git diff --exit-code tsconfig.json
      - run: npm run lint
      - run: npm test
      - run: npm run export:web
